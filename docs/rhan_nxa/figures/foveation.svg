<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF9F5; }
      .title { font-family: 'Liberation Sans', -apple-system, system-ui, sans-serif; font-size: 19px; font-weight: 800; fill: #0F172A; }
      .subtitle { font-family: 'Liberation Sans', -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #64748B; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.8; rx: 8px; }
      .header-text { font-family: 'Liberation Sans', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .body-text { font-family: 'Liberation Sans', system-ui, sans-serif; font-size: 11.5px; fill: #334155; }
      .dim-badge { font-family: 'Liberation Mono', monospace; font-size: 10.5px; fill: #16A34A; font-weight: 600; }
      .formula-text { font-family: 'Liberation Mono', monospace; font-size: 11px; fill: #15803D; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow-head); }
    </style>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="960" height="520" class="bg" rx="12"/>
  <rect x="15" y="15" width="930" height="490" fill="none" stroke="#E2E8F0" stroke-width="1" rx="8"/>

  <text x="35" y="45" class="title">Figure 14. Differentiable Spatial Transformer Foveation</text>
  <text x="35" y="66" class="subtitle">Extracting High-Acuity 56×56 Glimpse Patches via Differentiable Affine Bilinear Grid Sampling</text>

  <!-- LEFT: Full Scene & Crop Bounding Box -->
  <g transform="translate(45, 95)">
    <rect width="360" height="340" class="panel"/>
    <text x="180" y="26" text-anchor="middle" class="header-text">1. Full Input Scene x ∈ ℝ^[B, 3, 224, 224]</text>

    <!-- Visual Canvas -->
    <rect x="55" y="45" width="250" height="250" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" rx="4"/>
    <text x="180" y="40" text-anchor="middle" class="dim-badge" fill="#64748B">Normalized Domain [-1, 1]²</text>

    <!-- Axes -->
    <line x1="55" y1="170" x2="305" y2="170" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="180" y1="45" x2="180" y2="295" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="180" cy="170" r="3" fill="#94A3B8"/>
    <text x="195" y="185" font-size="9px" fill="#94A3B8">(0, 0)</text>

    <!-- Foveation Bounding Box centered at a_t = (+0.3, -0.4) -->
    <!-- Scale s = 56/224 = 0.25 -> box size = 250 * 0.25 = 62.5px -->
    <!-- Center: x = 180 + 0.3 * 125 = 217.5, y = 170 - 0.4 * 125 = 120 -->
    <rect x="186" y="89" width="63" height="63" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5" rx="3"/>
    <circle cx="217" cy="120" r="3.5" fill="#15803D"/>
    
    <text x="217" y="82" text-anchor="middle" font-size="10.5px" font-weight="700" fill="#15803D">Gaze Center a_t</text>
    <text x="217" y="168" text-anchor="middle" font-size="9.5px" fill="#15803D">56×56 Crop</text>

    <text x="180" y="320" text-anchor="middle" class="body-text" font-size="11px">Spatial Coordinates a_t = (x_t, y_t) ∈ [-1, 1]²</text>
  </g>

  <!-- Arrow Left -> Center -->
  <path d="M 405 265 L 465 265" class="arrow"/>
  <text x="435" y="255" text-anchor="middle" class="dim-badge" fill="#64748B">Grid</text>

  <!-- RIGHT: Affine Transformation & Bilinear Sampling -->
  <g transform="translate(465, 95)">
    <rect width="450" height="340" class="panel"/>
    <text x="225" y="26" text-anchor="middle" class="header-text" fill="#15803D">2. STN Affine Grid &amp; Differentiable Sampling</text>

    <!-- Affine Matrix -->
    <g transform="translate(25, 45)">
      <rect width="400" height="75" fill="#F0FDF4" stroke="#86EFAC" rx="6"/>
      <text x="15" y="22" class="header-text" font-size="12px" fill="#166534">Affine Transformation Matrix Θ_t:</text>
      <text x="20" y="48" class="formula-text" font-size="12px">Θ_t = [ s   0   x_t ]   where s = 56 / 224 = 0.25</text>
      <text x="20" y="66" class="formula-text" font-size="12px">      [ 0   s   y_t ]   (Fixed foveal scale factor)</text>
    </g>

    <!-- Bilinear Sampling -->
    <g transform="translate(25, 130)">
      <rect width="400" height="90" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
      <text x="15" y="22" class="header-text" font-size="12px">Grid Sample (torch.nn.functional.grid_sample):</text>
      <text x="15" y="42" class="formula-text">grid = affine_grid(Θ_t, size=[B, 3, 56, 56])</text>
      <text x="15" y="60" class="formula-text">x_fov = grid_sample(x, grid, mode='bilinear', align_corners=False)</text>
      <text x="15" y="78" class="dim-badge">Output Foveal Patch: [B, 3, 56, 56]</text>
    </g>

    <!-- Motor Jacobian Backprop -->
    <g transform="translate(25, 230)">
      <rect width="400" height="85" fill="#FEFCE8" stroke="#FDE047" rx="6"/>
      <text x="15" y="22" class="header-text" font-size="12px" fill="#A16207">Motor Jacobian &amp; Gradient Flow:</text>
      <text x="15" y="42" class="body-text" font-size="11px">• The bilinear operator is fully differentiable w.r.t. gaze coordinates a_t.</text>
      <text x="15" y="58" class="body-text" font-size="11px">• Computes motor Jacobian: ∂x_fov / ∂a_t.</text>
      <text x="15" y="74" class="dim-badge" fill="#A16207">Allows end-to-end learning of spatial fixation policy.</text>
    </g>
  </g>

  <!-- BOTTOM INVARIANT NOTE -->
  <g transform="translate(45, 455)">
    <rect width="870" height="50" fill="#F8FAFC" stroke="#E2E8F0" rx="6"/>
    <text x="20" y="22" class="body-text" font-weight="700">Foveal Invariants:</text>
    <text x="20" y="38" class="body-text">• Resolution 56×56 is locked: exactly 4×4 patches of size 14×14, matching CompactViT patch grid perfectly.</text>
  </g>
</svg>
