<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF9F5; }
      .title { font-family: 'Liberation Sans', -apple-system, system-ui, sans-serif; font-size: 19px; font-weight: 800; fill: #0F172A; }
      .subtitle { font-family: 'Liberation Sans', -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #64748B; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #E2E8F0; stroke-width: 1; stroke-dasharray: 4,3; }
      .header-text { font-family: 'Liberation Sans', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .tick-text { font-family: 'Liberation Sans', system-ui, sans-serif; font-size: 11px; fill: #64748B; }
      .body-text { font-family: 'Liberation Sans', system-ui, sans-serif; font-size: 11.5px; fill: #334155; }
      .dim-badge { font-family: 'Liberation Mono', monospace; font-size: 11px; font-weight: 700; }
      .bar-trades { fill: #94A3B8; stroke: #64748B; stroke-width: 1.5; }
      .bar-modeld { fill: #0284C7; stroke: #0369A1; stroke-width: 1.5; }
      .bar-sbr { fill: #EF4444; stroke: #DC2626; stroke-width: 1.5; }
      .error-bar { stroke: #0F172A; stroke-width: 2; }
    </style>
  </defs>

  <rect width="960" height="540" class="bg" rx="12"/>
  <rect x="15" y="15" width="930" height="510" fill="none" stroke="#E2E8F0" stroke-width="1" rx="8"/>

  <text x="35" y="45" class="title">Figure 9. Generation-0 Empirical Record: Robustness Advantage and the Clean Collapse Signature</text>
  <text x="35" y="66" class="subtitle">Quantitative Evaluation across 16 Evaluated Seeds (STL-10, PGD-100 Attack, ε = 0.094)</text>

  <!-- LEFT PLOT: Robust Accuracy (Model D vs TRADES) -->
  <g transform="translate(45, 95)">
    <rect width="410" height="340" class="panel"/>
    <text x="205" y="28" text-anchor="middle" class="header-text">Adversarial Robust Accuracy (PGD-100)</text>
    <text x="205" y="44" text-anchor="middle" class="tick-text">n = 16 seeds | Mean ± Standard Deviation</text>

    <!-- Y-Axis Grid & Ticks (0% to 50%) -->
    <!-- 40% (y = 80) -->
    <line x1="60" y1="80" x2="380" y2="80" class="grid"/>
    <text x="50" y="84" text-anchor="end" class="tick-text">40%</text>

    <!-- 30% (y = 130) -->
    <line x1="60" y1="130" x2="380" y2="130" class="grid"/>
    <text x="50" y="134" text-anchor="end" class="tick-text">30%</text>

    <!-- 20% (y = 180) -->
    <line x1="60" y1="180" x2="380" y2="180" class="grid"/>
    <text x="50" y="184" text-anchor="end" class="tick-text">20%</text>

    <!-- 10% (y = 230) -->
    <line x1="60" y1="230" x2="380" y2="230" class="grid"/>
    <text x="50" y="234" text-anchor="end" class="tick-text">10%</text>

    <!-- 0% (y = 280) -->
    <line x1="60" y1="280" x2="380" y2="280" class="axis"/>
    <text x="50" y="284" text-anchor="end" class="tick-text">0%</text>
    <line x1="60" y1="60" x2="60" y2="280" class="axis"/>

    <!-- Bar 1: Scaled TRADES Baseline (24.23%) -> y = 280 - (24.23 * 5) = 158.85 -->
    <rect x="110" y="159" width="75" height="121" class="bar-trades"/>
    <!-- Error Bar -->
    <line x1="147" y1="148" x2="147" y2="170" class="error-bar"/>
    <line x1="137" y1="148" x2="157" y2="148" class="error-bar"/>
    <line x1="137" y1="170" x2="157" y2="170" class="error-bar"/>
    <text x="147" y="140" text-anchor="middle" class="dim-badge" fill="#475569">24.23%</text>
    <text x="147" y="300" text-anchor="middle" class="tick-text" font-weight="700">TRADES</text>
    <text x="147" y="316" text-anchor="middle" class="tick-text">(Scaled Base)</text>

    <!-- Bar 2: Model D (34.02%) -> y = 280 - (34.02 * 5) = 109.9 -->
    <rect x="245" y="110" width="75" height="170" class="bar-modeld"/>
    <!-- Error Bar -->
    <line x1="282" y1="98" x2="282" y2="122" class="error-bar"/>
    <line x1="272" y1="98" x2="292" y2="98" class="error-bar"/>
    <line x1="272" y1="122" x2="292" y2="122" class="error-bar"/>
    <text x="282" y="90" text-anchor="middle" class="dim-badge" fill="#0284C7">34.02%</text>
    <text x="282" y="300" text-anchor="middle" class="tick-text" font-weight="700" fill="#0284C7">Model D</text>
    <text x="282" y="316" text-anchor="middle" class="tick-text">(Recurrent Core)</text>

    <!-- Delta Callout Bracket -->
    <path d="M 147 80 L 147 65 L 282 65 L 282 80" fill="none" stroke="#059669" stroke-width="2"/>
    <rect x="180" y="52" width="75" height="22" fill="#ECFDF5" stroke="#10B981" rx="4"/>
    <text x="217" y="67" text-anchor="middle" class="dim-badge" fill="#059669">+9.79 pp</text>
  </g>

  <!-- RIGHT PLOT: Clean Accuracy & The SBR Collapse Signature -->
  <g transform="translate(495, 95)">
    <rect width="420" height="340" class="panel"/>
    <text x="210" y="28" text-anchor="middle" class="header-text">Clean Accuracy &amp; The SBR Collapse Signature</text>
    <text x="210" y="44" text-anchor="middle" class="tick-text">Clean Performance on Unperturbed Images</text>

    <!-- Y-Axis Grid & Ticks (60% to 90%) -> 1% = 6.66px; 60% at y=280, 90% at y=80 -->
    <!-- 90% (y = 80) -->
    <line x1="60" y1="80" x2="390" y2="80" class="grid"/>
    <text x="50" y="84" text-anchor="end" class="tick-text">90%</text>

    <!-- 80% (y = 147) -->
    <line x1="60" y1="147" x2="390" y2="147" class="grid"/>
    <text x="50" y="151" text-anchor="end" class="tick-text">80%</text>

    <!-- 70% (y = 213) -->
    <line x1="60" y1="213" x2="390" y2="213" class="grid"/>
    <text x="50" y="217" text-anchor="end" class="tick-text">70%</text>

    <!-- 60% (y = 280) -->
    <line x1="60" y1="280" x2="390" y2="280" class="axis"/>
    <text x="50" y="284" text-anchor="end" class="tick-text">60%</text>
    <line x1="60" y1="60" x2="60" y2="280" class="axis"/>

    <!-- Bar 1: Clean Core (SBR OFF) ~82.4% -> y = 280 - (22.4 * 6.66) = 131 -->
    <rect x="110" y="131" width="75" height="149" class="bar-modeld"/>
    <text x="147" y="120" text-anchor="middle" class="dim-badge" fill="#0284C7">82.4%</text>
    <text x="147" y="300" text-anchor="middle" class="tick-text" font-weight="700">Clean Core</text>
    <text x="147" y="316" text-anchor="middle" class="tick-text">(SBR Disabled)</text>

    <!-- Bar 2: Legacy SBR Active ~72.6% -> y = 280 - (12.6 * 6.66) = 196 -->
    <rect x="250" y="196" width="75" height="84" class="bar-sbr"/>
    <text x="287" y="186" text-anchor="middle" class="dim-badge" fill="#DC2626">72.6%</text>
    <text x="287" y="300" text-anchor="middle" class="tick-text" font-weight="700" fill="#DC2626">+16-Slot SBR</text>
    <text x="287" y="316" text-anchor="middle" class="tick-text" fill="#DC2626">(E2, D2, D3)</text>

    <!-- Drop Callout Bracket -->
    <path d="M 147 110 L 147 95 L 287 95 L 287 110" fill="none" stroke="#DC2626" stroke-width="2"/>
    <rect x="180" y="82" width="80" height="22" fill="#FEF2F2" stroke="#EF4444" rx="4"/>
    <text x="220" y="97" text-anchor="middle" class="dim-badge" fill="#DC2626">−9.8 pp Drop</text>
  </g>

  <!-- BOTTOM METHODOLOGY NOTE -->
  <g transform="translate(45, 450)">
    <rect width="870" height="65" fill="#F8FAFC" stroke="#E2E8F0" rx="6"/>
    <text x="15" y="19" class="body-text" font-weight="700">Statistical Discipline &amp; Scientific Takeaways:</text>
    <text x="15" y="37" class="body-text">• Model D's +9.79 pp robust advantage over TRADES is statistically verified across 16 random seeds (PGD-100, ε = 0.094).</text>
    <text x="15" y="53" class="body-text">• SBR caused an identical ~10 pp drop across deliberate (E2) and accidental runs (D2, D3), proving an infrastructure confound.</text>
  </g>
</svg>
