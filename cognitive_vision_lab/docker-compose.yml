version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: cognitive_vision_lab/Dockerfile
    command: python3 -m cognitive_vision_lab.backend.server
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../report:/app/report:ro
      - ../data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ..
      dockerfile: cognitive_vision_lab/Dockerfile
    command: streamlit run cognitive_vision_lab/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../report:/app/report:ro
    depends_on:
      - backend

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cognitive_vision_lab
      POSTGRES_USER: cvlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvlab_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
