# Cognitive Vision Lab v2.0 — self-contained single-service deployment.
#
# The lab reads the project's real artifacts (checkpoints, SDT results,
# comparison table) directly from the repo, mounted read-only.
services:
  lab:
    build:
      context: ..
      dockerfile: cognitive_vision_lab/Dockerfile
    command: >
      streamlit run cognitive_vision_lab/app.py
      --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE_MB=25
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../checkpoints_tier2:/app/checkpoints_tier2:ro
      - ../report:/app/report:ro
      - ../tier1/results:/app/tier1/results:ro
      - ../phase5_sdt/results:/app/phase5_sdt/results:ro
      - ../phase3_human_study:/app/phase3_human_study:ro
    restart: unless-stopped
